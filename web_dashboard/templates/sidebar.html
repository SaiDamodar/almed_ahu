<!-- Sidebar Navigation -->

        <div class="sidebar-subtitle">AHU Control Dashboard</div>
    </div>

        <a href="/" class="nav-item {% if request.endpoint == 'index' or request.endpoint == 'dashboard' %}active{% endif %}">
            <span class="nav-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                </svg>
            </span>
            <span class="nav-label">Dashboard</span>
        </a>
        <a href="/users" class="nav-item {% if request.endpoint == 'users' %}active{% endif %}">
            <span class="nav-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
            </span>
            <span class="nav-label">Users</span>
        </a>
        <a href="/devices" class="nav-item {% if request.endpoint == 'devices' %}active{% endif %}">

                </svg>
            </span>
            <span class="nav-label">Devices</span>
        </a>
        <a href="/reports" class="nav-item {% if request.endpoint == 'reports' %}active{% endif %}">
            <span class="nav-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2"></rect>

            </span>
            <span class="nav-label">Reports</span>

                </svg>
            </span>
            <span class="nav-label">Calendar</span>
        </a>
        <a href="/profile" class="nav-item {% if request.endpoint == 'profile' %}active{% endif %}">
            <span class="nav-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>

                </svg>
            </span>
            <span class="nav-label">Profile</span>
        </a>

            <span class="nav-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
            </span>
            <span class="nav-label">OTA Updates</span>
        </a>
        <a href="/settings" class="nav-item {% if request.endpoint == 'settings' %}active{% endif %}">
            <span class="nav-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M12 1v6m0 6v6M5.64 5.64l4.24 4.24m4.24 4.24l4.24 4.24M1 12h6m6 0h6M5.64 18.36l4.24-4.24m4.24-4.24l4.24-4.24"></path>

            </div>
            <button class="logout-btn" onclick="window.location.href='/logout'" title="Logout">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </button>
        </div>
    </div>
</div>
