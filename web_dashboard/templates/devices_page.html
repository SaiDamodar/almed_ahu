<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devices - ALMED AHU Control</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-container">
        {% include 'sidebar.html' %}

        <div class="main-content">
            <div class="top-header">
                <div class="header-left">
                    <div class="search-box">
                        <span class="nav-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"></circle>
                                <path d="m21 21-4.35-4.35"></path>
                            </svg>
                        </span>
                        <input type="text" placeholder="Search devices..." id="device-search">
                    </div>
                </div>
                <div class="header-right">
                    <button class="icon-btn" title="Notifications">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="content-container">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                    <div>
                        <h1 class="page-title">Devices</h1>
                        <p class="page-subtitle">Monitor and manage all AHU devices</p>
                    </div>
                    <button class="btn btn-primary">+ Add Device</button>
                </div>

                <div id="devices-container">
                    <div class="loading">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script>
        async function loadDevices() {
            const container = document.getElementById('devices-container');
            
            try {
                const response = await api.getDevices();
                
                if (!response.success || !response.hospitals) {
                    container.innerHTML = `
                        <div class="section-card">
                            <div class="empty-state">
                                <div class="empty-icon">🖥️</div>
                                <div class="empty-text">No devices found</div>
                                <div class="empty-subtext">Connect your first device to get started</div>
                            </div>
                        </div>
                    `;
                    return;
                }

                // Flatten all devices
                const allDevices = [];
                for (const [hospital, rooms] of Object.entries(response.hospitals)) {
                    for (const [room, devices] of Object.entries(rooms)) {
                        allDevices.push(...devices);
                    }
                }

                if (allDevices.length === 0) {
                    container.innerHTML = `
                        <div class="section-card">
                            <div class="empty-state">
                                <div class="empty-icon">
                                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.5" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                                        <line x1="8" y1="21" x2="16" y2="21"></line>
                                        <line x1="12" y1="17" x2="12" y2="21"></line>
                                    </svg>
                                </div>
                                <div class="empty-text">No devices found</div>
                                <div class="empty-subtext">Connect your first device to get started</div>
                            </div>
                        </div>
                    `;
                    return;
                }

                // Render devices in a grid
                container.innerHTML = `
                    <div class="summary-grid" style="grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));">
                        ${allDevices.map(device => `
                            <div class="summary-card" style="cursor: pointer;" onclick="window.location.href='/ahu/${device.id}'">
                                <div class="card-header">
                                    <div class="card-icon devices">
                                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                                            <line x1="8" y1="21" x2="16" y2="21"></line>
                                            <line x1="12" y1="17" x2="12" y2="21"></line>
                                        </svg>
                                    </div>
                                    <span class="status-badge offline" id="status-${device.id}">
                                        <span class="status-dot"></span> Offline
                                    </span>
                                </div>
                                <div style="margin-top: 16px;">
                                    <div style="font-size: 20px; font-weight: 600; color: var(--text-primary); margin-bottom: 8px;">${device.name}</div>
                                    <div style="font-size: 14px; color: var(--text-secondary); margin-bottom: 4px;">${device.site}</div>
                                    <div style="font-size: 12px; color: var(--text-tertiary);">${device.room}</div>
                                </div>
                                <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border-color);">
                                    <div style="display: flex; gap: 16px; font-size: 12px;">
                                        <div>
                                            <div style="color: var(--text-secondary);">Temp</div>
                                            <div style="color: var(--text-primary); font-weight: 600;" id="temp-${device.id}">--</div>
                                        </div>
                                        <div>
                                            <div style="color: var(--text-secondary);">Humidity</div>
                                            <div style="color: var(--text-primary); font-weight: 600;" id="hum-${device.id}">--</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;

                // Load status for each device
                allDevices.forEach(device => {
                    loadDeviceStatus(device.id);
                });

                // Refresh every 5 seconds
                setInterval(() => {
                    allDevices.forEach(device => {
                        loadDeviceStatus(device.id);
                    });
                }, 5000);

            } catch (error) {
                console.error('Error loading devices:', error);
                container.innerHTML = `
                    <div class="section-card">
                        <div class="empty-state">
                            <div class="empty-icon">⚠️</div>
                            <div class="empty-text">Error loading devices</div>
                            <div class="empty-subtext">${error.message}</div>
                        </div>
                    </div>
                `;
            }
        }

        async function loadDeviceStatus(deviceId) {
            try {
                const response = await api.getDeviceStatus(deviceId);
                if (response.success && response.data) {
                    const data = response.data;
                    const telemetry = data.telemetry || {};
                    const isOnline = data.status === 'online';
                    
                    // Update status badge
                    const statusBadge = document.getElementById(`status-${deviceId}`);
                    if (statusBadge) {
                        statusBadge.className = `status-badge ${isOnline ? 'online' : 'offline'}`;
                        statusBadge.innerHTML = `
                            <span class="status-dot"></span> ${isOnline ? 'Online' : 'Offline'}
                        `;
                    }
                    
                    // Update temperature
                    const tempEl = document.getElementById(`temp-${deviceId}`);
                    if (tempEl && telemetry.temp !== undefined) {
                        tempEl.textContent = `${telemetry.temp.toFixed(1)}°C`;
                    }
                    
                    // Update humidity
                    const humEl = document.getElementById(`hum-${deviceId}`);
                    if (humEl && telemetry.hum !== undefined) {
                        humEl.textContent = `${telemetry.hum.toFixed(1)}%`;
                    }
                }
            } catch (error) {
                console.error(`Error loading status for ${deviceId}:`, error);
            }
        }

        // Load devices on page load
        loadDevices();
    </script>
</body>
</html>
