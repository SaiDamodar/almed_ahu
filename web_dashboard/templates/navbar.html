<!-- Shared Navigation Bar Component -->
<div class="top-bar">
    <div style="display: flex; align-items: center;">
        <span class="brand">ALMED</span>
        <div class="brand-divider"></div>
        <div class="nav-links">
            <a href="/" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">Home</a>
            <a href="/hospitals" class="nav-link {% if request.endpoint == 'hospitals' %}active{% endif %}">Hospitals</a>
        </div>
    </div>
    <div class="top-bar-actions">
        <div id="connection-status" class="status-indicator">
            <div class="status-dot"></div>
            <span>Disconnected</span>
        </div>
        <button class="icon-button" id="theme-toggle" onclick="toggleTheme()" title="Toggle Theme">●</button>
        <a href="/settings" class="icon-button" title="Settings">⚙</a>
        <a href="/logout" class="logout-btn" title="Logout">Logout</a>
    </div>
</div>
