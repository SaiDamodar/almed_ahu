<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Push Notifications - ALMED AHU Control</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .notification-form {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-primary);
        }
        .form-input, .form-textarea, .form-select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: border-color 0.2s;
        }
        .form-input:focus, .form-textarea:focus, .form-select:focus {
            outline: none;
            border-color: var(--primary);
        }
        .form-textarea {
            min-height: 100px;
            resize: vertical;
        }
        .char-count {
            text-align: right;
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .target-options {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .target-option {
            padding: 10px 20px;
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--bg-primary);
        }
        .target-option:hover {
            border-color: var(--primary);
        }
        .target-option.selected {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }
        .target-option input {
            display: none;
        }
        .send-btn {
            padding: 14px 28px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .send-btn:hover {
            background: var(--primary-hover);
        }
        .send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .history-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }
        .history-title {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-primary);
        }
        .history-meta {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .history-body {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .history-stats {
            display: flex;
            gap: 16px;
            font-size: 12px;
        }
        .stat-success {
            color: #388e3c;
        }
        .stat-failed {
            color: #d32f2f;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
        .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .preview-card {
            background: linear-gradient(135deg, #1E88E5, #1565C0);
            border-radius: 12px;
            padding: 16px;
            color: white;
            margin-bottom: 24px;
        }
        .preview-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .preview-icon {
            width: 36px;
            height: 36px;
            background: white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .preview-app {
            font-size: 12px;
            opacity: 0.8;
        }
        .preview-title {
            font-weight: 600;
            font-size: 15px;
        }
        .preview-body {
            font-size: 14px;
            opacity: 0.9;
        }
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-primary);
        }
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
        }
        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        {% include 'sidebar.html' %}

        <div class="main-content">
            <div class="top-header">
                <div class="header-left">
                    <h2 style="margin: 0; font-size: 20px;">Push Notifications</h2>
                </div>
                <div class="header-right">
                    <button class="icon-btn" title="Refresh" onclick="loadHistory()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path>
                            <path d="M21 3v5h-5"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="content-container">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
                    <!-- Left Column - Send Notification -->
                    <div>
                        <h3 class="section-title">📤 Send Notification</h3>
                        
                        <!-- Preview -->
                        <div class="preview-card">
                            <div class="preview-header">
                                <div class="preview-icon">🏥</div>
                                <div>
                                    <div class="preview-app">ALMED AHU</div>
                                    <div class="preview-title" id="previewTitle">Notification Title</div>
                                </div>
                            </div>
                            <div class="preview-body" id="previewBody">Your notification message will appear here...</div>
                        </div>
                        
                        <!-- Form -->
                        <div class="notification-form">
                            <div class="form-group">
                                <label class="form-label">Notification Title</label>
                                <input type="text" class="form-input" id="notifTitle" 
                                       placeholder="Enter notification title" maxlength="100"
                                       oninput="updatePreview()">
                                <div class="char-count"><span id="titleCount">0</span>/100</div>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">Message Body</label>
                                <textarea class="form-textarea" id="notifBody" 
                                          placeholder="Enter notification message" maxlength="500"
                                          oninput="updatePreview()"></textarea>
                                <div class="char-count"><span id="bodyCount">0</span>/500</div>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">Send To</label>
                                <div class="target-options">
                                    <label class="target-option selected" onclick="selectTarget('all')">
                                        <input type="radio" name="target" value="all" checked>
                                        📢 All Users
                                    </label>
                                    <label class="target-option" onclick="selectTarget('hospital_users')">
                                        <input type="radio" name="target" value="hospital_users">
                                        🏥 Hospital Users Only
                                    </label>
                                </div>
                            </div>
                            
                            <button class="send-btn" onclick="sendNotification()" id="sendBtn">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="m22 2-7 20-4-9-9-4 20-7z"></path>
                                </svg>
                                Send Notification
                            </button>
                        </div>
                    </div>
                    
                    <!-- Right Column - History -->
                    <div>
                        <h3 class="section-title">📋 Recent Notifications</h3>
                        
                        <div id="historyContainer">
                            <div class="empty-state">
                                <div class="empty-icon">🔔</div>
                                <div>Loading history...</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedTarget = 'all';

        function updatePreview() {
            const title = document.getElementById('notifTitle').value || 'Notification Title';
            const body = document.getElementById('notifBody').value || 'Your notification message will appear here...';
            
            document.getElementById('previewTitle').textContent = title;
            document.getElementById('previewBody').textContent = body;
            
            document.getElementById('titleCount').textContent = document.getElementById('notifTitle').value.length;
            document.getElementById('bodyCount').textContent = document.getElementById('notifBody').value.length;
        }

        function selectTarget(target) {
            selectedTarget = target;
            document.querySelectorAll('.target-option').forEach(opt => {
                opt.classList.toggle('selected', opt.querySelector('input').value === target);
            });
        }

        async function sendNotification() {
            const title = document.getElementById('notifTitle').value.trim();
            const body = document.getElementById('notifBody').value.trim();
            
            if (!title) {
                alert('Please enter a notification title');
                return;
            }
            if (!body) {
                alert('Please enter a notification message');
                return;
            }
            
            const btn = document.getElementById('sendBtn');
            btn.disabled = true;
            btn.innerHTML = '<span>Sending...</span>';
            
            try {
                const response = await fetch('/api/admin/notifications/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: title,
                        body: body,
                        target: selectedTarget
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert(`✅ ${data.message}`);
                    document.getElementById('notifTitle').value = '';
                    document.getElementById('notifBody').value = '';
                    updatePreview();
                    loadHistory();
                } else {
                    alert(`❌ ${data.message}`);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to send notification');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="m22 2-7 20-4-9-9-4 20-7z"></path>
                    </svg>
                    Send Notification
                `;
            }
        }

        async function loadHistory() {
            try {
                const response = await fetch('/api/admin/notifications/history');
                const data = await response.json();
                
                const container = document.getElementById('historyContainer');
                
                if (data.success && data.notifications.length > 0) {
                    container.innerHTML = data.notifications.map(notif => `
                        <div class="history-card">
                            <div class="history-header">
                                <div class="history-title">${escapeHtml(notif.title)}</div>
                                <div class="history-meta">${formatDate(notif.sent_at)}</div>
                            </div>
                            <div class="history-body">${escapeHtml(notif.body)}</div>
                            <div class="history-stats">
                                <span class="stat-success">✓ ${notif.sent_count} sent</span>
                                ${notif.failed_count > 0 ? `<span class="stat-failed">✗ ${notif.failed_count} failed</span>` : ''}
                                <span>Target: ${notif.target}</span>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📭</div>
                            <div>No notifications sent yet</div>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading history:', error);
            }
        }

        function formatDate(dateStr) {
            if (!dateStr) return 'N/A';
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-IN', {
                day: '2-digit',
                month: 'short',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Load history on page load
        document.addEventListener('DOMContentLoaded', loadHistory);
    </script>
</body>
</html>
