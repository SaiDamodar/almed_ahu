<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospitals & Devices - ALMED</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    {% include 'navbar.html' %}

    <!-- Main Content -->
    <div class="container page-transition">
        <h1 style="font-size: 28px; font-weight: 600; margin: 24px 0;">Hospitals & Devices</h1>
        <div id="hospitals-container">
            <div class="loading">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script>
        async function loadHospitals() {
            const container = document.getElementById('hospitals-container');
            
            try {
                const response = await api.getDevices();
                
                if (!response.success || !response.hospitals) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon" style="font-size: 60px;">AHU</div>
                            <div class="empty-state-text">No hospitals or devices found</div>
                        </div>
                    `;
                    return;
                }

                const hospitals = response.hospitals;
                
                if (Object.keys(hospitals).length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon" style="font-size: 60px;">AHU</div>
                            <div class="empty-state-text">No hospitals or devices found</div>
                        </div>
                    `;
                    return;
                }

                // Render hospitals hierarchy
                container.innerHTML = Object.entries(hospitals).map(([hospital, rooms]) => `
                    <div class="hospital-section">
                        <h2 class="hospital-title">${hospital}</h2>
                        ${Object.entries(rooms).map(([room, devices]) => `
                            <div class="room-section">
                                <h3 class="room-title">${room}</h3>
                                <div class="devices-grid">
                                    ${devices.map(device => `
                                        <div class="card ahu-card" onclick="window.location.href='/ahu/${device.id}'">
                                            <div class="ahu-header">
                                                <div>
                                                    <div class="ahu-name">${device.name}</div>
                                                    <div class="ahu-location">${device.room.toUpperCase()} • ${device.site}</div>
                                                </div>
                                                <div class="status-badge offline" id="status-${device.id}">
                                                    <div class="status-badge-dot"></div>
                                                    <span>Offline</span>
                                                </div>
                                            </div>
                                            <div style="margin-top: 20px;">
                                                <button class="btn btn-primary" style="width: 100%;" onclick="event.stopPropagation(); window.location.href='/ahu/${device.id}'">
                                                    View Details
                                                </button>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `).join('');

                // Load status for all devices
                Object.values(hospitals).forEach(rooms => {
                    Object.values(rooms).forEach(devices => {
                        devices.forEach(device => {
                            loadDeviceStatus(device.id);
                        });
                    });
                });

                // Refresh every 5 seconds
                setInterval(() => {
                    Object.values(hospitals).forEach(rooms => {
                        Object.values(rooms).forEach(devices => {
                            devices.forEach(device => {
                                loadDeviceStatus(device.id);
                            });
                        });
                    });
                }, 5000);

            } catch (error) {
                console.error('Error loading hospitals:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon" style="font-size: 60px;">!</div>
                        <div class="empty-state-text">Error: ${error.message}</div>
                    </div>
                `;
            }
        }

        async function loadDeviceStatus(deviceId) {
            try {
                const response = await api.getDeviceStatus(deviceId);
                if (response.success && response.data) {
                    const statusBadge = document.getElementById(`status-${deviceId}`);
                    if (statusBadge) {
                        const isOnline = response.data.status === 'online';
                        statusBadge.className = `status-badge ${isOnline ? 'online' : 'offline'}`;
                        statusBadge.innerHTML = `
                            <div class="status-badge-dot"></div>
                            <span>${isOnline ? 'Online' : 'Offline'}</span>
                        `;
                    }
                }
            } catch (error) {
                console.error(`Error loading status for ${deviceId}:`, error);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadHospitals();
        });
    </script>
</body>
</html>
