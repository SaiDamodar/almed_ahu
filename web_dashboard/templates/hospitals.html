<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospitals & Devices - ALMED</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-container">
        {% include 'sidebar.html' %}

        <div class="main-content">
            <div class="top-header">
                <div class="header-left">
                    <div class="search-box">
                        <span class="nav-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"></circle>
                                <path d="m21 21-4.35-4.35"></path>
                            </svg>
                        </span>
                        <input type="text" placeholder="Search hospitals, rooms, devices..." id="hospital-search">
                    </div>
                </div>
            </div>

            <div class="content-container">
                <h1 class="page-title">Hospitals & Devices</h1>
                <p class="page-subtitle">Browse devices grouped by hospital and room</p>

                <div id="hospitals-container">
                    <div class="loading">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script>
        let hospitalsData = {};
        let statusRefreshTimer = null;

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text == null ? '' : String(text);
            return div.innerHTML;
        }

        function safeDomId(deviceId) {
            return 'device-' + String(deviceId).replace(/[^a-zA-Z0-9_-]/g, '_');
        }

        function renderHospitals() {
            const container = document.getElementById('hospitals-container');
            const search = (document.getElementById('hospital-search').value || '').trim().toLowerCase();

            if (Object.keys(hospitalsData).length === 0) {
                container.innerHTML = `
                    <div class="section-card">
                        <div class="empty-state">
                            <div class="empty-icon">🏥</div>
                            <div class="empty-text">No hospitals or devices found</div>
                        </div>
                    </div>
                `;
                return;
            }

            const sections = Object.entries(hospitalsData).map(([hospital, rooms]) => {
                const roomSections = Object.entries(rooms).map(([room, devices]) => {
                    const visibleDevices = devices.filter(device => {
                        if (!search) return true;
                        const haystack = [hospital, room, device.name, device.site, device.room, device.id, device.ahu]
                            .filter(Boolean)
                            .join(' ')
                            .toLowerCase();
                        return haystack.includes(search);
                    });

                    if (visibleDevices.length === 0) return '';

                    return `
                        <div class="room-section" data-room="${escapeHtml(room)}">
                            <h3 class="room-title">${escapeHtml(room)}</h3>
                            <div class="devices-grid">
                                ${visibleDevices.map(device => `
                                    <div class="summary-card hospital-device-card"
                                         data-device-id="${escapeHtml(device.id)}"
                                         onclick="window.location.href='/ahu/${encodeURIComponent(device.id)}'">
                                        <div class="card-header">
                                            <div class="card-icon devices">
                                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                                                    <line x1="8" y1="21" x2="16" y2="21"></line>
                                                    <line x1="12" y1="17" x2="12" y2="21"></line>
                                                </svg>
                                            </div>
                                            <span class="status-badge offline" id="status-${safeDomId(device.id)}">
                                                <span class="status-dot"></span> Offline
                                            </span>
                                        </div>
                                        <div class="hospital-device-body">
                                            <div class="hospital-device-name">${escapeHtml(device.name)}</div>
                                            <div class="hospital-device-meta">${escapeHtml(device.site)}</div>
                                            <div class="hospital-device-location">${escapeHtml(device.room)} • ${escapeHtml(device.site)}</div>
                                        </div>
                                        <button class="btn btn-primary hospital-device-btn"
                                                onclick="event.stopPropagation(); window.location.href='/ahu/${encodeURIComponent(device.id)}'">
                                            View Details
                                        </button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }).filter(Boolean).join('');

                if (!roomSections) return '';

                return `
                    <div class="hospital-section" data-hospital="${escapeHtml(hospital)}">
                        <h2 class="hospital-title">${escapeHtml(hospital)}</h2>
                        ${roomSections}
                    </div>
                `;
            }).filter(Boolean).join('');

            if (!sections) {
                container.innerHTML = `
                    <div class="section-card">
                        <div class="empty-state">
                            <div class="empty-icon">🔍</div>
                            <div class="empty-text">No matches for your search</div>
                            <div class="empty-subtext">Try a different hospital, room, or device name</div>
                        </div>
                    </div>
                `;
                return;
            }

            container.innerHTML = sections;
            refreshAllStatuses();
        }

        async function loadHospitals() {
            const container = document.getElementById('hospitals-container');

            try {
                const response = await api.getDevices();

                if (!response.success || !response.hospitals) {
                    container.innerHTML = `
                        <div class="section-card">
                            <div class="empty-state">
                                <div class="empty-icon">🏥</div>
                                <div class="empty-text">No hospitals or devices found</div>
                            </div>
                        </div>
                    `;
                    return;
                }

                hospitalsData = response.hospitals;

                if (Object.keys(hospitalsData).length === 0) {
                    container.innerHTML = `
                        <div class="section-card">
                            <div class="empty-state">
                                <div class="empty-icon">🏥</div>
                                <div class="empty-text">No hospitals or devices found</div>
                            </div>
                        </div>
                    `;
                    return;
                }

                renderHospitals();

                if (statusRefreshTimer) clearInterval(statusRefreshTimer);
                statusRefreshTimer = setInterval(refreshAllStatuses, 5000);
            } catch (error) {
                console.error('Error loading hospitals:', error);
                container.innerHTML = `
                    <div class="section-card">
                        <div class="empty-state">
                            <div class="empty-icon">⚠️</div>
                            <div class="empty-text">Error loading hospitals</div>
                            <div class="empty-subtext">${escapeHtml(error.message)}</div>
                        </div>
                    </div>
                `;
            }
        }

        function refreshAllStatuses() {
            Object.values(hospitalsData).forEach(rooms => {
                Object.values(rooms).forEach(devices => {
                    devices.forEach(device => loadDeviceStatus(device.id));
                });
            });
        }

        async function loadDeviceStatus(deviceId) {
            try {
                const response = await api.getDeviceStatus(deviceId);
                if (response.success && response.data) {
                    const statusBadge = document.getElementById(`status-${safeDomId(deviceId)}`);
                    if (statusBadge) {
                        const isOnline = response.data.status === 'online';
                        statusBadge.className = `status-badge ${isOnline ? 'online' : 'offline'}`;
                        statusBadge.innerHTML = `
                            <span class="status-dot"></span> ${isOnline ? 'Online' : 'Offline'}
                        `;
                    }
                }
            } catch (error) {
                console.error(`Error loading status for ${deviceId}:`, error);
            }
        }

        document.getElementById('hospital-search').addEventListener('input', renderHospitals);
        loadHospitals();
    </script>
</body>
</html>
