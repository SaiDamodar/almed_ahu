<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - ALMED AHU Control</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-container">
        {% include 'sidebar.html' %}

        <div class="main-content">
            <div class="top-header">
                <div class="header-left">
                    <div class="search-box">
                        <span class="nav-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"></circle>
                                <path d="m21 21-4.35-4.35"></path>
                            </svg>
                        </span>
                        <input type="text" placeholder="Search reports...">
                    </div>
                </div>
                <div class="header-right">
                    <button class="icon-btn" title="Notifications">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="content-container">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                    <div>
                        <h1 class="page-title">Reports</h1>
                        <p class="page-subtitle">View system reports and analytics</p>
                    </div>
                    <button class="btn btn-primary">+ Generate Report</button>
                </div>

                <div class="section-card">
                    <div class="empty-state">
                        <div class="empty-icon">📄</div>
                        <div class="empty-text">No reports available</div>
                        <div class="empty-subtext">Generate your first report to get started</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
