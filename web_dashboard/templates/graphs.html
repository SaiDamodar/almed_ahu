<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphs & Analytics - ALMED</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .chart-wrapper {
            height: 300px;
            margin-bottom: 24px;
        }
        .time-range-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .time-range-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: transparent;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .time-range-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="app-container">
        {% include 'sidebar.html' %}

        <div class="main-content">
            <div class="top-header">
                <div class="header-left">
                    <button class="icon-btn" onclick="window.history.back()" style="font-size: 18px;">←</button>
                    <div class="search-box">
                        <span class="nav-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"></circle>
                                <path d="m21 21-4.35-4.35"></path>
                            </svg>
                        </span>
                        <input type="text" placeholder="Search...">
                    </div>
                </div>
                <div class="header-right">
                    <button class="icon-btn" title="Notifications">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="content-container">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                    <div>
                        <h1 class="page-title">Graphs & Analytics</h1>
                        <p class="page-subtitle" id="device-info">AHU {{ device_id }}</p>
                    </div>
                    <a href="/ahu/{{ device_id }}" class="btn btn-secondary" style="text-decoration: none;">← Control</a>
                </div>

                <!-- Time Range Selector -->
                <div class="section-card" style="margin-bottom: 24px;">
            <div class="time-range-selector">
                <button class="time-range-btn active" data-hours="1" onclick="setTimeRange(1)">1 Hour</button>
                <button class="time-range-btn" data-hours="6" onclick="setTimeRange(6)">6 Hours</button>
                <button class="time-range-btn" data-hours="24" onclick="setTimeRange(24)">24 Hours</button>
                <button class="time-range-btn" data-hours="168" onclick="setTimeRange(168)">7 Days</button>
            </div>
        </div>

                <!-- Temperature Chart -->
                <div class="section-card" style="margin-bottom: 24px;">
                    <h2 class="section-title">Temperature</h2>
                    <div class="chart-wrapper">
                        <canvas id="temp-chart"></canvas>
                    </div>
                </div>

                <!-- Humidity Chart -->
                <div class="section-card" style="margin-bottom: 24px;">
                    <h2 class="section-title">Humidity</h2>
                    <div class="chart-wrapper">
                        <canvas id="hum-chart"></canvas>
                    </div>
                </div>

                <!-- Motor Cycles Chart -->
                <div class="section-card" style="margin-bottom: 24px;">
                    <h2 class="section-title">Motor Cycles</h2>
                    <div class="chart-wrapper">
                        <canvas id="motor-chart"></canvas>
                    </div>
                </div>

                <!-- System Status Chart -->
                <div class="section-card" style="margin-bottom: 24px;">
                    <h2 class="section-title">System Status</h2>
                    <div class="chart-wrapper">
                        <canvas id="status-chart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script src="{{ url_for('static', filename='js/charts.js') }}"></script>
    <script>
        const deviceId = '{{ device_id }}';
        let currentHours = 24;

        async function loadCharts() {
            try {
                const response = await api.getTelemetry(deviceId, currentHours);
                if (response.success && response.data) {
                    const data = response.data;
                    
                    // Create charts
                    charts.createTemperatureChart('temp-chart', data);
                    charts.createHumidityChart('hum-chart', data);
                    charts.createMotorCyclesChart('motor-chart', data);
                    charts.createSystemStatusChart('status-chart', data);
                } else {
                    console.error('No data available');
                }
            } catch (error) {
                console.error('Error loading charts:', error);
            }
        }

        function setTimeRange(hours) {
            currentHours = hours;
            
            // Update button states
            document.querySelectorAll('.time-range-btn').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.hours) === hours);
            });
            
            // Reload charts
            loadCharts();
        }

        // Load charts on page load
        loadCharts();
        
        // Refresh charts every 30 seconds
        setInterval(loadCharts, 30000);
    </script>
</body>
</html>
