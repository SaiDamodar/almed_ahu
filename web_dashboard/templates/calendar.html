<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar - ALMED AHU Control</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .calendar-container {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }
        
        .calendar-view {
            flex: 1;
            min-width: 600px;
        }
        
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .calendar-nav {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .calendar-nav-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .calendar-nav-btn:hover {
            background: var(--bg-tertiary);
            border-color: var(--purple-primary);
        }
        
        .calendar-month-year {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }
        
        .calendar-day-header {
            text-align: center;
            padding: 12px;
            font-weight: 600;
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .calendar-day {
            aspect-ratio: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        
        .calendar-day:hover {
            background: var(--bg-tertiary);
            border-color: var(--purple-primary);
        }
        
        .calendar-day.other-month {
            opacity: 0.3;
        }
        
        .calendar-day.today {
            background: var(--purple-light);
            border-color: var(--purple-primary);
        }
        
        .calendar-day.has-events {
            border-color: var(--success);
        }
        
        .day-number {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        
        .day-events {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        
        .day-event-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
        }
        
        .day-event-dot.maintenance {
            background: var(--warning);
        }
        
        .day-event-dot.inspection {
            background: var(--info);
        }
        
        .events-sidebar {
            width: 320px;
        }
        
        .events-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .event-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .event-item:hover {
            border-color: var(--purple-primary);
            transform: translateY(-2px);
        }
        
        .event-date {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        
        .event-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        
        .event-description {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        
        .event-type {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .event-type.maintenance {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }
        
        .event-type.inspection {
            background: rgba(59, 130, 246, 0.2);
            color: var(--info);
        }
        
        .event-type.other {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }
        
        .event-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        
        .event-action-btn {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .event-action-btn.edit {
            background: rgba(59, 130, 246, 0.2);
            color: var(--info);
        }
        
        .event-action-btn.delete {
            background: rgba(239, 68, 68, 0.2);
            color: var(--error);
        }
        
        .event-action-btn:hover {
            opacity: 0.8;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 24px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }
        
        .modal-close:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        
        .form-input {
            width: 100%;
            padding: 12px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--purple-primary);
        }
        
        .form-select {
            width: 100%;
            padding: 12px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
        }
        
        .form-textarea {
            width: 100%;
            padding: 12px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            resize: vertical;
            min-height: 80px;
        }
        
        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        {% include 'sidebar.html' %}

        <div class="main-content">
            <div class="top-header">
                <div class="header-left">
                    <div class="search-box">
                        <span class="nav-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"></circle>
                                <path d="m21 21-4.35-4.35"></path>
                            </svg>
                        </span>
                        <input type="text" id="search-events" placeholder="Search events..." onkeyup="filterEvents()">
                    </div>
                </div>
                <div class="header-right">
                    <button class="icon-btn" title="Notifications">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="content-container">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                    <div>
                        <h1 class="page-title">Calendar</h1>
                        <p class="page-subtitle">Schedule and manage maintenance events</p>
                    </div>
                    <button class="btn btn-primary" onclick="openEventModal()">+ Add Event</button>
                </div>

                <div class="calendar-container">
                    <div class="calendar-view">
                        <div class="section-card">
                            <div class="calendar-header">
                                <div class="calendar-nav">
                                    <button class="calendar-nav-btn" onclick="changeMonth(-1)">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M15 18l-6-6 6-6"></path>
                                        </svg>
                                    </button>
                                    <button class="calendar-nav-btn" onclick="goToToday()">Today</button>
                                    <button class="calendar-nav-btn" onclick="changeMonth(1)">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M9 18l6-6-6-6"></path>
                                        </svg>
                                    </button>
                                </div>
                                <div class="calendar-month-year" id="month-year"></div>
                            </div>
                            <div class="calendar-grid" id="calendar-grid"></div>
                        </div>
                    </div>
                    
                    <div class="events-sidebar">
                        <div class="section-card">
                            <h2 class="section-title" style="margin-bottom: 16px;">Upcoming Events</h2>
                            <div class="events-list" id="events-list"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Event Modal -->
    <div class="modal" id="event-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title">Add Event</h2>
                <button class="modal-close" onclick="closeEventModal()">&times;</button>
            </div>
            <form id="event-form" onsubmit="saveEvent(event)">
                <input type="hidden" id="event-id">
                <div class="form-group">
                    <label class="form-label">Title</label>
                    <input type="text" class="form-input" id="event-title" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Date</label>
                    <input type="date" class="form-input" id="event-date" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Time</label>
                    <input type="time" class="form-input" id="event-time" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Type</label>
                    <select class="form-select" id="event-type" required>
                        <option value="maintenance">Maintenance</option>
                        <option value="inspection">Inspection</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea class="form-textarea" id="event-description" rows="3"></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeEventModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentDate = new Date();
        let events = JSON.parse(localStorage.getItem('ahu_calendar_events') || '[]');
        let editingEventId = null;

        const daysOfWeek = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const months = ['January', 'February', 'March', 'April', 'May', 'June', 
                       'July', 'August', 'September', 'October', 'November', 'December'];

        function initCalendar() {
            renderCalendar();
            renderEvents();
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            document.getElementById('month-year').textContent = `${months[month]} ${year}`;
            
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const daysInMonth = lastDay.getDate();
            const startingDayOfWeek = firstDay.getDay();
            
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            
            // Day headers
            daysOfWeek.forEach(day => {
                const header = document.createElement('div');
                header.className = 'calendar-day-header';
                header.textContent = day;
                grid.appendChild(header);
            });
            
            // Previous month days
            const prevMonthLastDay = new Date(year, month, 0).getDate();
            for (let i = startingDayOfWeek - 1; i >= 0; i--) {
                const day = document.createElement('div');
                day.className = 'calendar-day other-month';
                day.innerHTML = `<div class="day-number">${prevMonthLastDay - i}</div>`;
                grid.appendChild(day);
            }
            
            // Current month days
            const today = new Date();
            for (let day = 1; day <= daysInMonth; day++) {
                const date = new Date(year, month, day);
                const dayElement = document.createElement('div');
                dayElement.className = 'calendar-day';
                
                if (date.toDateString() === today.toDateString()) {
                    dayElement.classList.add('today');
                }
                
                const dayEvents = getEventsForDate(date);
                if (dayEvents.length > 0) {
                    dayElement.classList.add('has-events');
                }
                
                dayElement.innerHTML = `
                    <div class="day-number">${day}</div>
                    <div class="day-events">
                        ${dayEvents.slice(0, 3).map(event => 
                            `<div class="day-event-dot ${event.type}"></div>`
                        ).join('')}
                    </div>
                `;
                
                dayElement.onclick = () => openEventModalForDate(date);
                grid.appendChild(dayElement);
            }
            
            // Next month days
            const totalCells = grid.children.length - 7; // Subtract headers
            const remainingCells = 42 - totalCells; // 6 weeks * 7 days
            for (let day = 1; day <= remainingCells; day++) {
                const dayElement = document.createElement('div');
                dayElement.className = 'calendar-day other-month';
                dayElement.innerHTML = `<div class="day-number">${day}</div>`;
                grid.appendChild(dayElement);
            }
        }

        function getEventsForDate(date) {
            const dateStr = formatDate(date);
            return events.filter(event => event.date === dateStr);
        }

        function formatDate(date) {
            return date.toISOString().split('T')[0];
        }

        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderCalendar();
        }

        function goToToday() {
            currentDate = new Date();
            renderCalendar();
        }

        function renderEvents() {
            const eventsList = document.getElementById('events-list');
            const sortedEvents = [...events]
                .filter(event => {
                    const eventDate = new Date(event.date + 'T' + event.time);
                    return eventDate >= new Date().setHours(0, 0, 0, 0);
                })
                .sort((a, b) => {
                    const dateA = new Date(a.date + 'T' + a.time);
                    const dateB = new Date(b.date + 'T' + b.time);
                    return dateA - dateB;
                })
                .slice(0, 10);
            
            if (sortedEvents.length === 0) {
                eventsList.innerHTML = '<div class="empty-state"><div class="empty-text">No upcoming events</div></div>';
                return;
            }
            
            eventsList.innerHTML = sortedEvents.map(event => `
                <div class="event-item" onclick="editEvent('${event.id}')">
                    <div class="event-date">${formatEventDate(event.date)} at ${event.time}</div>
                    <div class="event-title">${event.title}</div>
                    ${event.description ? `<div class="event-description">${event.description}</div>` : ''}
                    <div class="event-type ${event.type}">${event.type}</div>
                    <div class="event-actions">
                        <button class="event-action-btn edit" onclick="event.stopPropagation(); editEvent('${event.id}')">Edit</button>
                        <button class="event-action-btn delete" onclick="event.stopPropagation(); deleteEvent('${event.id}')">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        function formatEventDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function openEventModal(date = null) {
            editingEventId = null;
            document.getElementById('modal-title').textContent = 'Add Event';
            document.getElementById('event-form').reset();
            document.getElementById('event-id').value = '';
            
            if (date) {
                document.getElementById('event-date').value = formatDate(date);
            } else {
                document.getElementById('event-date').value = formatDate(new Date());
            }
            
            document.getElementById('event-time').value = '09:00';
            document.getElementById('event-modal').classList.add('active');
        }

        function openEventModalForDate(date) {
            openEventModal(date);
        }

        function closeEventModal() {
            document.getElementById('event-modal').classList.remove('active');
            editingEventId = null;
        }

        function editEvent(eventId) {
            const event = events.find(e => e.id === eventId);
            if (!event) return;
            
            editingEventId = eventId;
            document.getElementById('modal-title').textContent = 'Edit Event';
            document.getElementById('event-id').value = event.id;
            document.getElementById('event-title').value = event.title;
            document.getElementById('event-date').value = event.date;
            document.getElementById('event-time').value = event.time;
            document.getElementById('event-type').value = event.type;
            document.getElementById('event-description').value = event.description || '';
            
            document.getElementById('event-modal').classList.add('active');
        }

        function saveEvent(e) {
            e.preventDefault();
            
            const eventData = {
                id: editingEventId || Date.now().toString(),
                title: document.getElementById('event-title').value,
                date: document.getElementById('event-date').value,
                time: document.getElementById('event-time').value,
                type: document.getElementById('event-type').value,
                description: document.getElementById('event-description').value
            };
            
            if (editingEventId) {
                const index = events.findIndex(e => e.id === editingEventId);
                if (index !== -1) {
                    events[index] = eventData;
                }
            } else {
                events.push(eventData);
            }
            
            localStorage.setItem('ahu_calendar_events', JSON.stringify(events));
            closeEventModal();
            renderCalendar();
            renderEvents();
        }

        function deleteEvent(eventId) {
            if (confirm('Are you sure you want to delete this event?')) {
                events = events.filter(e => e.id !== eventId);
                localStorage.setItem('ahu_calendar_events', JSON.stringify(events));
                renderCalendar();
                renderEvents();
            }
        }

        function filterEvents() {
            const searchTerm = document.getElementById('search-events').value.toLowerCase();
            const eventItems = document.querySelectorAll('.event-item');
            
            eventItems.forEach(item => {
                const text = item.textContent.toLowerCase();
                item.style.display = text.includes(searchTerm) ? 'block' : 'none';
            });
        }

        // Close modal when clicking outside
        document.getElementById('event-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeEventModal();
            }
        });

        // Initialize calendar on load
        initCalendar();
    </script>
</body>
</html>
